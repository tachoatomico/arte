<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obra — @tachoatomico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <header class="site-header">
    <a class="site-brand" href="#/">@tachoatomico</a>
    <span class="site-tagline">enganche cuántico con el arte</span>
  </header>

  <div id="loading">cargando obra…</div>

  <div id="not-found">
    <h2>Obra no encontrada</h2>
    <p></p>
  </div>

  <main id="artwork">
    <div class="artwork-grid">
      <figure class="artwork-media">
        <img id="artwork-image" src="" alt="">
      </figure>
      <div class="artwork-info">
        <h1 class="artwork-title" id="artwork-title"></h1>
        <div class="artwork-meta" id="artwork-meta"></div>
        <span class="status" id="artwork-status"></span>
        <div class="artwork-detail" id="artwork-detail"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>identidad digital · @tachoatomico</span>
  </footer>

</div>

<script src="js/app.js"></script>
</body>
</html>
